name: chaoxing-console

x-runtime: &runtime
  image: chaoxing-console:local
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  environment:
    DATA_DIR: /data
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
  volumes:
    - console-data:/data
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true

services:
  web:
    <<: *runtime
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
  worker:
    <<: *runtime
    command: ["python", "-m", "backend.app.worker"]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/worker_health.py"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s

volumes:
  console-data:
