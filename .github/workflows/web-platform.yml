name: Platform verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27', cache-dependency-path: engine/go.sum}
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - run: pip install -r requirements.txt pytest
      - run: python scripts/vendor_yatori.py
      - run: python scripts/build_engine.py
      - run: go test ./... && go test github.com/yatori-dev/yatori-go-core/api/xuexitong
        working-directory: engine
      - run: python -m pytest -q
      - run: pip check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: '.', file: Dockerfile, push: false, tags: 'chaoxing-console:ci'}
